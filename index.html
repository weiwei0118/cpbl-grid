<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>CPBL GRID</title><style>
:root{--bg:#efe5e0;--ink:#111;--muted:#665f5b;--cell:#34465d;--cell2:#3d526c;--good:#45ce8a;--bad:#ff7771}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC",system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}.top{height:58px;background:#000}.page{width:min(980px,96vw);margin:auto;padding:28px 0 44px}.intro{text-align:center;margin-bottom:24px}h1{margin:0;font-size:clamp(50px,9vw,86px);line-height:.9;letter-spacing:-.065em}.sub{font-size:20px;font-weight:700;margin-top:10px}.rules{max-width:760px;margin:10px auto 0;color:var(--muted);font-size:14px;line-height:1.6}.notice{max-width:760px;margin:13px auto 0;text-align:left;background:#ffffff60;border:1px solid #0002;border-radius:11px;padding:11px 14px}.notice b{font-size:13px}.notice ul{margin:5px 0 0;padding-left:19px;color:var(--muted);font-size:13px;line-height:1.65}.loading{padding:70px 20px;text-align:center;font-size:20px}.grid{display:grid;grid-template-columns:190px repeat(3,1fr);grid-template-rows:150px repeat(3,205px);gap:6px}.score,.crit{display:flex;align-items:center;justify-content:center;text-align:center;padding:9px;line-height:1.08}.score{flex-direction:column}.score span{font-size:17px}.score strong{font-size:38px;font-weight:500;margin-top:4px}.crit{font-size:24px;font-weight:500}.crit.stat,.crit.award{font-size:20px}.cell{position:relative;border:1.5px solid #111;border-radius:12px;background:var(--cell);color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.cell:hover:not(:disabled){background:var(--cell2)}.cell.solved{background:linear-gradient(145deg,#f2d675,#fff0b1);color:#111}.plus{width:40px;height:40px;border:1px dashed #ffffff55;border-radius:50%;display:grid;place-items:center;color:#ffffff66;font-size:24px}.avatar{width:86px;height:86px;border-radius:50%;background:#ffffffaa;display:grid;place-items:center;font-size:33px;font-weight:700}.namebar{position:absolute;left:0;right:0;bottom:0;background:#050505;color:#fff;text-align:center;padding:6px;font-size:16px}.rarity{position:absolute;left:0;top:0;background:#050505;color:#fff;padding:3px 5px;font-size:13px}.controls,.status{margin-left:196px}.controls{display:flex;gap:8px;padding-top:12px}.status{padding-top:8px;min-height:26px;color:var(--muted);font-size:13px}.ctrl{border:1px solid #111;background:transparent;border-radius:5px;padding:8px 13px}.modalbg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modalbg.open{display:flex}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#0d1b2c;color:#fff;border:1px solid #42546d;border-radius:18px;padding:19px}.modal h2{margin:0;font-size:29px}.pair{color:#9eafc4;margin:7px 0 8px}.possible{color:#c5d1df;font-size:14px;font-weight:700;margin-bottom:10px}.search{width:100%;background:#071421;color:#fff;border:1px solid #d3aa18;border-radius:11px;padding:13px 14px;font-size:18px;outline:none}.results{display:grid;gap:6px;max-height:360px;overflow:auto;margin-top:9px}.result{border:1px solid #314e6f;background:#142941;color:#fff;border-radius:10px;padding:10px 12px;text-align:left;font-size:17px;font-weight:800}.msg{min-height:27px;margin-top:9px;font-weight:800}.good{color:var(--good)}.bad{color:var(--bad)}.dup{color:#ffd15c}.close{margin-top:10px;float:right;border:1px solid #3a5574;background:#172d48;color:#fff;border-radius:9px;padding:8px 12px;font-weight:800}@media(max-width:760px){.page{width:100%;padding:22px 8px 35px;overflow-x:auto}.intro{min-width:700px}.grid{min-width:700px;grid-template-columns:160px repeat(3,174px);grid-template-rows:140px repeat(3,178px)}.crit{font-size:19px}.controls,.status{margin-left:166px}}
</style></head><body><div class="top"></div><main class="page"><section class="intro"><h1>CPBL GRID</h1><div class="sub">中華職棒九宮格</div><p class="rules">每一格填入一位同時符合<strong>橫列與直欄條件</strong>的中職球員。題目會混合球隊、單季／生涯數據與年度獎項。</p><div class="notice"><b>注意事項</b><ul><li>同一位球員整個九宮格只能使用一次；舊名／新名若為同一 player ID 也算重複。</li><li>兄弟象與中信兄弟分開；味全龍（1990–1999）與味全龍（2021–）分開。</li><li>球隊效力以 2026 開季前已正式加盟（職棒37年）為截止點；年度成績／獎項以 2025 賽季（職棒36年）為結算基準。</li></ul></div></section><div id="loading" class="loading">正在載入中職歷史資料…</div><section id="grid" class="grid" hidden></section><div id="controls" class="controls" hidden><button id="newBtn" class="ctrl">← 換一題</button><button id="resetBtn" class="ctrl">重新開始</button></div><div id="status" class="status"></div></main><div id="playerModal" class="modalbg"><section class="modal"><h2>選擇球員</h2><div id="pair" class="pair"></div><div id="possible" class="possible"></div><input id="search" class="search" type="search" autocomplete="off" placeholder="輸入球員姓名，例如: 陳傑憲"><div id="results" class="results"></div><div id="msg" class="msg"></div><button id="closePlayer" class="close">關閉</button></section></div><script>
const BASE='https://raw.githubusercontent.com/ldkrsi/cpbl-opendata/master/';
const TEAM_EQ={'統一獅':['統一獅','統一7-ELEVEn獅']};
const PATCH={'陳子豪':'味全龍（2021–）','朱育賢':'味全龍（2021–）','黃子鵬':'台鋼雄鷹','林岱安':'富邦悍將','江少慶':'統一獅','王維中':'台鋼雄鷹','劉時豪':'台鋼雄鷹','賴智垣':'台鋼雄鷹','林書逸':'富邦悍將'};
const AWARDS={
'曾拿過全壘打王':['魔鷹','吉力吉撈．鞏冠','朱育賢','林安可','張志豪','王柏融','高國輝','林益全','林智勝','陳金鋒','謝佳賢','張泰山','林仲秋','怪力男','鷹俠'],
'曾拿過打擊王':['吳念庭','林立','梁家榮','陳俊秀','陳傑憲','胡金龍','林益全','潘武雄','彭政閔','羅敏卿','怪力男','王光輝'],
'曾拿過安打王':['李凱威','邱智呈','劉基鴻','林立','王威晨','陳傑憲','朱育賢','胡金龍','林益全','張正偉','陳冠任','高國慶','張泰山','彭政閔','陳致遠','黃忠義','林易增'],
'曾拿過打點王':['吉力吉撈．鞏冠','魔鷹','廖健富','林立','朱育賢','林安可','林益全','蔣智賢','王柏融','林泓育','張泰山','謝佳賢','黃忠義','林仲秋'],
'曾拿過盜壘王':['李凱威','陳晨威','林立','王威晨','王勝偉','林智平','張正偉','鄭達鴻','張志豪','陽森','鄭兆行','黃甘霖','林易增']};
let PLAYERS=[],CRIT=[],CSET={},state={rows:[],cols:[],solved:{},selected:null};
function csv(t){let a=[],r=[],s='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){s+='"';i++}else q=!q}else if(c===','&&!q){r.push(s);s=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;r.push(s);if(r.some(x=>x!==''))a.push(r);r=[];s=''}else s+=c}if(s||r.length){r.push(s);a.push(r)}let h=a.shift()||[];return a.map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||''])))}
function num(v){let n=Number(v);return isFinite(n)?n:0}
async function txt(u){let r=await fetch(u);if(!r.ok)throw Error(r.status+' '+u);return r.text()}
async function load(){try{let standings=csv(await txt(BASE+'CPBL/standings.csv')),tm=new Map;standings.forEach(x=>tm.set(x.Year+'|'+x['Team ID'],x.Team));let meta=csv(await txt(BASE+'players.csv')),canon=new Map(meta.map(x=>[x.ID,x.Name]));let P=new Map,bat=new Map,pit=new Map;function get(id){if(!P.has(id))P.set(id,{i:id,n:new Set,t:new Set});return P.get(id)}function stat(M,id,y){if(!M.has(id))M.set(id,new Map);let Y=M.get(id);if(!Y.has(y))Y.set(y,{});return Y.get(y)}let jobs=[];for(let y=1990;y<=2024;y++)for(let type of ['battings','pitchings'])jobs.push((async()=>{let rows=csv(await txt(BASE+'CPBL/'+type+'/'+y+'.csv'));rows.forEach(x=>{if(num(x.G)<=0)return;let id=x.ID,name=x.Name;if(!id||!name)return;let p=get(id);p.n.add(name);let team=tm.get(y+'|'+x['Team ID'])||x['Team Name']||'';if(team==='味全龍')team=y<=1999?'味全龍（1990–1999）':(y>=2021?'味全龍（2021–）':team);if(team)p.t.add(team);let z=stat(type==='battings'?bat:pit,id,y);for(let k of (type==='battings'?['H','HR','RBI','SB']:['W','SO','SV']))z[k]=(z[k]||0)+num(x[k])})})());await Promise.all(jobs);P.forEach((p,id)=>{if(canon.get(id))p.n.add(canon.get(id))});let byName={};P.forEach(p=>p.n.forEach(n=>(byName[n]||(byName[n]=[])).push(p)));for(let [n,t] of Object.entries(PATCH))for(let p of (byName[n]||[]))p.t.add(t);PLAYERS=[...P.values()].map(p=>({i:p.i,n:[...p.n],t:[...p.t]}));function add(id,label,kind,ids){ids=[...new Set(ids)];if(ids.length)CRIT.push({id,label,kind,players:ids})}let teams=new Set;PLAYERS.forEach(p=>p.t.forEach(t=>teams.add(t)));[...teams].forEach(t=>add('team:'+t,t,'team',PLAYERS.filter(p=>(TEAM_EQ[t]||[t]).some(x=>p.t.includes(x))).map(p=>p.i)));function any(M,id,f){let Y=M.get(id);return Y&&[...Y.values()].some(f)}add('s20hr','單季 20+ 轟','stat',PLAYERS.filter(p=>any(bat,p.i,z=>num(z.HR)>=20)).map(p=>p.i));add('s100h','單季 100+ 安','stat',PLAYERS.filter(p=>any(bat,p.i,z=>num(z.H)>=100)).map(p=>p.i));add('s80rbi','單季 80+ 打點','stat',PLAYERS.filter(p=>any(bat,p.i,z=>num(z.RBI)>=80)).map(p=>p.i));add('s10w','單季 10+ 勝','stat',PLAYERS.filter(p=>any(pit,p.i,z=>num(z.W)>=10)).map(p=>p.i));add('s100k','單季 100+ K','stat',PLAYERS.filter(p=>any(pit,p.i,z=>num(z.SO)>=100)).map(p=>p.i));add('s20sv','單季 20+ 救援','stat',PLAYERS.filter(p=>any(pit,p.i,z=>num(z.SV)>=20)).map(p=>p.i));function career(M,id,k){let Y=M.get(id),s=0;if(Y)Y.forEach(z=>s+=num(z[k]));return s}add('c100hr','生涯 100+ 轟','stat',PLAYERS.filter(p=>career(bat,p.i,'HR')>=100).map(p=>p.i));add('c1000h','生涯 1000+ 安','stat',PLAYERS.filter(p=>career(bat,p.i,'H')>=1000).map(p=>p.i));add('c100w','生涯 100+ 勝','stat',PLAYERS.filter(p=>career(pit,p.i,'W')>=100).map(p=>p.i));add('c1000k','生涯 1000+ K','stat',PLAYERS.filter(p=>career(pit,p.i,'SO')>=1000).map(p=>p.i));for(let [label,names] of Object.entries(AWARDS)){let ids=[];names.forEach(n=>(byName[n]||[]).forEach(p=>ids.push(p.i)));add('award:'+label,label,'award',ids)}CSET=Object.fromEntries(CRIT.map(c=>[c.id,new Set(c.players)]));build();document.getElementById('loading').hidden=true;document.getElementById('grid').hidden=false;document.getElementById('controls').hidden=false;render()}catch(e){document.getElementById('loading').textContent='資料載入失敗，請重新整理頁面。 '+e.message}}
function used(){return new Set(Object.values(state.solved).map(x=>x.id))}function ints(a,b,ex=true){let A=CSET[a.id],B=CSET[b.id],U=used(),o=[];for(let id of A)if(B.has(id)&&(!ex||!U.has(id)))o.push(id);return o}function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function build(){let T=CRIT.filter(c=>c.kind==='team'),N=CRIT.filter(c=>c.kind!=='team');for(let n=0;n<3000;n++){let r=sh([...sh(T).slice(0,2),sh(N).slice(0,1)]),ids=new Set(r.map(x=>x.id)),c=sh([...sh(T.filter(x=>!ids.has(x.id))).slice(0,2),sh(N.filter(x=>!ids.has(x.id))).slice(0,1)]);if(r.length===3&&c.length===3&&r.every(a=>c.every(b=>ints(a,b,false).length))){state.rows=r;state.cols=c;return}}state.rows=sh(T).slice(0,3);state.cols=sh(T).slice(3,6)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let g=document.getElementById('grid');g.innerHTML='';let s=document.createElement('div');s.className='score';s.innerHTML='<span>Rarity score:</span><strong>—</strong>';g.appendChild(s);state.cols.forEach(c=>{let e=document.createElement('div');e.className='crit '+c.kind;e.textContent=c.label;g.appendChild(e)});state.rows.forEach((r,ri)=>{let h=document.createElement('div');h.className='crit '+r.kind;h.textContent=r.label;g.appendChild(h);state.cols.forEach((c,ci)=>{let k=ri+'-'+ci,b=document.createElement('button');b.className='cell'+(state.solved[k]?' solved':'');if(state.solved[k]){let n=state.solved[k].name;b.innerHTML='<span class="rarity">—</span><span class="avatar">'+esc([...n][0])+'</span><span class="namebar">'+esc(n)+'</span>';b.disabled=true}else{b.innerHTML='<span class="plus">+</span>';b.onclick=()=>openCell(ri,ci)}g.appendChild(b)})})}
function openCell(r,c){let a=state.rows[r],b=state.cols[c];state.selected={a,b,key:r+'-'+c};document.getElementById('pair').textContent=a.label+' × '+b.label;document.getElementById('possible').textContent='共有 '+ints(a,b,true).length+' 位可能球員';search.value='';results.innerHTML='';msg.textContent='';playerModal.classList.add('open');setTimeout(()=>search.focus(),30)}function doSearch(q){q=q.trim().toLowerCase();results.innerHTML='';if(!q)return;let M=new Map;PLAYERS.forEach(p=>p.n.forEach(n=>{if(n.toLowerCase().includes(q)){if(!M.has(n))M.set(n,[]);M.get(n).push(p)}}));[...M].sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant')).slice(0,70).forEach(([n,ps])=>{let x=document.createElement('button');x.className='result';x.textContent=n;x.onclick=()=>submit(n,ps);results.appendChild(x)})}function submit(name,ps){let s=state.selected,V=new Set(ints(s.a,s.b,false)),U=used(),m=ps.filter(p=>V.has(p.i));if(!m.length){msg.className='msg bad';msg.textContent='❌ '+name+' 不符合這一格';return}let p=m.find(x=>!U.has(x.i));if(!p){msg.className='msg dup';msg.textContent='⚠️ '+name+' 已經在其他格使用過了';return}state.solved[s.key]={id:p.i,name};msg.className='msg good';msg.textContent='✅ '+name+' 正確';render();setTimeout(()=>{playerModal.classList.remove('open');state.selected=null},350)}
search.oninput=e=>doSearch(e.target.value);closePlayer.onclick=()=>playerModal.classList.remove('open');resetBtn.onclick=()=>{state.solved={};render()};newBtn.onclick=()=>{state.solved={};build();render()};playerModal.onclick=e=>{if(e.target===playerModal)playerModal.classList.remove('open')};load();
</script></body></html>
