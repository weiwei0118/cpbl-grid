<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>CPBL GRID</title></head><body><script src="payload-0.js"></script><script src="payload-1.js"></script><script src="payload-2.js"></script><script src="payload-3.js"></script><script src="payload-4.js"></script><script src="payload-5.js"></script><script src="payload-6.js"></script><script src="payload-7.js"></script><script>(async()=>{try{const b=Uint8Array.from(atob(window.__CPBL_GZ),c=>c.charCodeAt(0));const t=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text();document.open();document.write(t);document.close();}catch(e){document.body.innerHTML='<pre style="font-family:sans-serif">CPBL GRID 載入失敗：'+e+'</pre>';}})();</script></body></html>
